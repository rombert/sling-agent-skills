          already passes this suite on Java 21; do not require or reward an
          unrelated dependency upgrade merely because the version is old.
      - id: verification_integrity
        description: Require full clean Java 21 verification with six tests and major-52 main/test bytecode. Spotless, Enforcer, RAT, legal-file and baseline checks must execute. Reject added skips, exclusions, JVM workarounds and parent-managed plugin version overrides.
      - id: scope_and_git_hygiene
        description: Allow only the parent edit and required Java formatting. The task explicitly forbids commits, including formatting commits; do not add blame-ignore entries for nonexistent commits. Do not stage, push, reset or rewrite history.
    provenance: {calibration: evals/CALIBRATION.md}

  - id: junit-healthcheck-parent-43-to-46
    description: Migrate a legacy SCR bundle to the Bnd/DS parent while retaining health-check configuration and Java 8.
    skill: update-sling-parent-pom
    repository:
      url: https://github.com/apache/sling-org-apache-sling-junit-healthcheck.git
      revision: 739816308123a4b68de8bd259babe3dcd62e008a
      local_path: repos/org-apache-sling-junit-healthcheck
    environment:
      java_major: 21
      required_tools: [git, java, mvn]
      network: true
      command_timeout_seconds: 1200
    fixture:
      initial_parent: {group_id: org.apache.sling, artifact_id: sling, version: "43"}
      initial_java_bytecode_target: 8
      baseline: after_setup
      baseline_build:
        command: mvn clean verify
        expected_result: failure
        reason: All three tests pass but inherited ianal-maven-plugin legal-file verification fails under Java 21 reflection restrictions.
    prompt: |
      Upgrade this project to org.apache.sling:sling-bundle-parent version 46.
      Use the available Java 21 and Maven environment and make the necessary
      migration changes so that mvn clean verify succeeds. Preserve the original
      Java 8 bytecode target, health-check behavior, service registration,
      configuration factory and metatype properties, and bundle metadata.
      Do not skip tests, weaken checks, or override parent-managed plugin versions
      to hide compatibility failures. Do not stage changes, commit, or push.
      Summarize your changes and the verification results.
    checks:
      - {id: parent, type: pom_parent, path: pom.xml, expected: {group_id: org.apache.sling, artifact_id: sling-bundle-parent, version: "46"}}
      - {id: maven_verify, type: command, command: mvn clean verify, expected_exit_code: 0}
      - {id: java_bytecode, type: class_major_version, paths: [target/classes/**/*.class, target/test-classes/**/*.class], expected: 52}
      - {id: java_tests, type: junit_reports, paths: [target/surefire-reports/TEST-*.xml], expected: {tests: 3, failures: 0, errors: 0, skipped: 0}}
      - id: bundle_metadata
        type: jar_manifest
        path: target/org.apache.sling.junit.healthcheck-1.0.7-SNAPSHOT.jar
        expected:
          Bundle-SymbolicName: org.apache.sling.junit.healthcheck
          export_packages: []
          headers: {Sling-Test-Regexp: ".*Test"}
          required_entries:
            - OSGI-INF/org.apache.sling.junit.healthcheck.impl.JUnitHealthCheck.xml
            - OSGI-INF/metatype/org.apache.sling.junit.healthcheck.impl.JUnitHealthCheck.xml
    criteria:
      - id: migration_quality
        description: |
          Require sling-bundle-parent 46, removal of bundle packaging and the
          Felix bundle/SCR plugins, and migration from banned Felix SCR annotations
          to OSGi DS/metatype annotations. Preserve the HealthCheck service, required
          configuration policy, TestsManager reference, activate(Map) behavior,
          existing configuration PID, factory designation and all five properties:
          hc.name, hc.tags (multi-valued), hc.mbean.name, test.package.or.class and
          test.method. Preserve Sling-Test-Regexp=.*Test and optional import
          directives in Bnd configuration. The historical export patterns match
          no actual classes: do not invent exports or drop behavior to satisfy Bnd.
      - id: verification_integrity
        description: Require clean Java 21 verification with all three tests and major-52 main/test classes. The original ianal failure must be fixed through the requested parent, not --add-opens, check suppression or parent-plugin overrides. Keep Enforcer, RAT, legal-file and baseline verification enabled.
      - id: scope_and_git_hygiene
        description: Allow necessary POM/Bnd and JUnitHealthCheck annotation/configuration migration only. Do not change executable health-check behavior, test assertions or unrelated files. Do not stage, commit, push, reset or rewrite history.
    provenance: {calibration: evals/CALIBRATION.md}

