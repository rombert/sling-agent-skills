# Shared scenario data, independent of Promptfoo, Tessl, or Inspect.
# Adapters supply the runtime and map checks/criteria to native framework scoring.
# Fixture setup and expected results are harness data, not part of the user prompt.
schema_version: 1

# All existing repositories are calibrated below. Future uncalibrated inventory
# belongs here, never in the runnable list with guessed targets or test totals.
fixtures: []

scenarios:
  - id: jcr-js-nodetypes-parent-34-to-46
    description: Migrate a real Sling bundle to the first Java-21-compatible parent while preserving Java 8 bytecode.
    skill: update-sling-parent-pom

    repository:
      url: https://github.com/apache/sling-org-apache-sling-jcr-js-nodetypes.git
      revision: c2d77bc8755b31d25d39ab0820fbdc87cb0f6147
      working_directory: .

    environment:
      java_major: 21
      required_tools: [git, java, mvn]
      network: true
      command_timeout_seconds: 1200
      # Record actual runtime versions in each evaluation result.
      validated_runtimes:
        - {maven: "3.9.16", java: "21.0.12.1"}
        - {maven: "3.10.0", java: "21.0.13"}

    fixture:
      initial_parent:
        group_id: org.apache.sling
        artifact_id: sling
        version: "34"
      initial_java_bytecode_target: 8
      # Capture the prepared fixture, including setup, as the comparison baseline.
      baseline: after_setup
      baseline_build:
        command: mvn clean verify
        expected_result: failure
        reason: Surefire 2.20.1 cannot detect Java 21; compilation still produces Java 8 bytecode.
      setup:
        - type: git_apply
          # The historical POM uses tabs; keep this YAML space-indented.
          options: [--ignore-whitespace]
          reason: >-
            Repair the historical Jasmine runner before the task starts. Its
            failure is independent of parent selection and should not be scored
            as parent migration. This configuration passes all 39 JavaScript
            specs without modifying production JavaScript or test sources.
          patch: |
            diff --git a/pom.xml b/pom.xml
            --- a/pom.xml
            +++ b/pom.xml
            @@ -53,7 +53,7 @@
                             <plugin>
                                 <groupId>com.github.searls</groupId>
                                 <artifactId>jasmine-maven-plugin</artifactId>
            -                    <version>1.3.1.0</version>
            +                    <version>3.0-beta-02</version>
                             </plugin>
                         </plugins>
                     </pluginManagement>
            @@ -61,7 +61,7 @@
                         <plugin>
                             <groupId>com.github.searls</groupId>
                             <artifactId>jasmine-maven-plugin</artifactId>
            -                <version>1.3.1.0</version>
            +                <version>3.0-beta-02</version>
                             <executions>
                                 <execution>
                                     <goals>
            @@ -69,8 +69,26 @@
                                     </goals>
                                 </execution>
                             </executions>
            +                <dependencies>
            +                    <dependency>
            +                        <groupId>org.seleniumhq.selenium</groupId>
            +                        <artifactId>htmlunit-driver</artifactId>
            +                        <version>2.45.0</version>
            +                    </dependency>
            +                </dependencies>
                             <configuration>
                                 <specRunnerTemplate>DEFAULT</specRunnerTemplate>
            +                    <webDriverClassName>org.openqa.selenium.htmlunit.HtmlUnitDriver</webDriverClassName>
            +                    <webDriverCapabilities>
            +                        <capability>
            +                            <name>browserName</name>
            +                            <value>htmlunit</value>
            +                        </capability>
            +                        <capability>
            +                            <name>javascriptEnabled</name>
            +                            <value>true</value>
            +                        </capability>
            +                    </webDriverCapabilities>
                                 <jsSrcDir>${project.basedir}/src/main/resources/SLING-INF/libs/jsnodetypes/js</jsSrcDir>
                             </configuration>
                         </plugin>

    prompt: |
      Upgrade this project to org.apache.sling:sling-bundle-parent version 46.
      Use the available Java 21 and Maven environment and make the necessary
      migration changes so that mvn clean verify succeeds. Preserve the original
      Java 8 bytecode target and the bundle's behavior and metadata. Do not skip
      tests, weaken checks, or override parent-managed plugin versions to hide
      compatibility failures. Do not stage changes, commit, or push. Summarize
      your changes and the verification results.

    checks:
      - id: parent
        type: pom_parent
        path: pom.xml
        expected:
          group_id: org.apache.sling
          artifact_id: sling-bundle-parent
          version: "46"

      - id: maven_verify
        type: command
        # Run independently in the edited workspace, not just from the agent log.
        command: mvn clean verify
        expected_exit_code: 0

      - id: java_bytecode
        type: class_major_version
        # Require nonempty class sets; release takes precedence over legacy target.
        paths: [target/classes/**/*.class, target/test-classes/**/*.class]
        expected: 52

      - id: java_tests
        type: junit_reports
        paths: [target/surefire-reports/TEST-*.xml]
        expected: {tests: 29, failures: 0, errors: 0, skipped: 0}

      - id: javascript_tests
        type: junit_reports
        paths: [target/jasmine/TEST-jasmine.xml]
        expected: {tests: 39, failures: 0, errors: 0, skipped: 0}

      - id: bundle_metadata
        type: jar_manifest
        path: target/org.apache.sling.jcr.js.nodetypes-0.1.0-SNAPSHOT.jar
        expected:
          Bundle-SymbolicName: org.apache.sling.jcr.js.nodetypes
          export_packages: [org.apache.sling.jcr.js.nodetypes.javascript]
          initial_content_paths:
            - /libs/jsnodetypes
            - /libs/jsnodetypes/documentation
            - /libs/jsnodetypes/js

    criteria:
      - id: migration_quality
        description: |
          Judge the actual diff against the prepared fixture, not just the final
          summary. Require a real parent upgrade, migration from the Felix bundle
          plugin to the bundle parent's Bnd setup, preservation of initial-content
          directives and exported packages, and a Java-21-compatible Mockito
          migration. The verified solution uses mockito-core 4.11.0 and replaces
          the two org.mockito.Matchers.anyInt imports with ArgumentMatchers.anyInt;
          equivalent compatible solutions are acceptable. Production behavior and
          existing test assertions must remain unchanged.

      - id: verification_integrity
        description: |
          Require full Java 21 verification, with all 29 Java tests and 39
          JavaScript specs executed. Reject added test/quality-check skip flags,
          exclusions, removed tests, weakened assertions, JVM --add-opens
          workarounds, or overrides of parent-managed plugin versions. The
          historical migration's bnd.baseline.skip=true is acceptable because
          this 0.1.0-SNAPSHOT module has no released baseline; do not treat it as
          permission to disable any other check. Parent 46's strict legal-file
          verification and RAT checks must execute successfully.

      - id: scope_and_git_hygiene
        description: |
          Changes should be limited to the POM, Bnd configuration, and necessary
          Mockito test-source migration. Do not alter the prepared Jasmine runner,
          production code, JavaScript specs, or unrelated files. Do not stage,
          commit, push, reset, or rewrite repository history. Evaluate git actions
          using the agent transcript, separately from harness fixture preparation.

    provenance:
      parent_boundary:
        last_failing: "45"
        first_passing: "46"
        reason: >-
          Parents 40–45 inherit ianal-maven-plugin 1.0-alpha-1, whose legal-file
          verification fails on Java 21's reflection restrictions. Parent 46
          replaces it with tools-maven-plugin 1.4 while retaining strict checks.
      reference_revision: e06e10b580f41747a366762083a4e5f34e5cce98

  - id: discovery-standalone-parent-46-to-52
    description: Upgrade a small DS bundle to parent 52 without raising inherited Java 8 bytecode.
    skill: update-sling-parent-pom
    repository:
      url: https://github.com/apache/sling-org-apache-sling-discovery-standalone.git
      revision: 48c24b4dc5f8ef37018d4421e80cdffd2f2a8e29
      local_path: repos/org-apache-sling-discovery-standalone
    environment:
      java_major: 21
      required_tools: [git, java, mvn]
      network: true
      command_timeout_seconds: 1200
    fixture:
      initial_parent: {group_id: org.apache.sling, artifact_id: sling-bundle-parent, version: "46"}
      initial_java_bytecode_target: 8
      baseline: after_setup
      baseline_build: {command: mvn clean verify, expected_result: success, reason: All six existing tests pass on Java 21.}
    prompt: |
      Upgrade this project to org.apache.sling:sling-bundle-parent version 52.
      Use the available Java 21 and Maven environment and make the necessary
      migration changes so that mvn clean verify succeeds. Preserve the original
      Java 8 bytecode target and the bundle's behavior and metadata. Do not skip
      tests, weaken checks, or override parent-managed plugin versions to hide
      compatibility failures. Do not stage changes, commit, or push. Summarize
      your changes and the verification results.
    checks:
      - {id: parent, type: pom_parent, path: pom.xml, expected: {group_id: org.apache.sling, artifact_id: sling-bundle-parent, version: "52"}}
      - {id: maven_verify, type: command, command: mvn clean verify, expected_exit_code: 0}
      - {id: java_bytecode, type: class_major_version, paths: [target/classes/**/*.class, target/test-classes/**/*.class], expected: 52}
      - {id: java_tests, type: junit_reports, paths: [target/surefire-reports/TEST-*.xml], expected: {tests: 6, failures: 0, errors: 0, skipped: 0}}
      - id: bundle_metadata
        type: jar_manifest
        path: target/org.apache.sling.discovery.standalone-1.0.5-SNAPSHOT.jar
        expected:
          Bundle-SymbolicName: org.apache.sling.discovery.standalone
          export_packages: []
          required_entries:
            - OSGI-INF/org.apache.sling.discovery.impl.standalone.NoClusterDiscoveryService.xml
            - OSGI-INF/metatype/org.apache.sling.discovery.impl.standalone.Config.xml
    criteria:
      - id: migration_quality
        description: |
          Require parent 52, explicit dependency scopes (provided for SLF4J API
          and OSGi framework, test for JUnit and SLF4J Simple), and replacement of
          the banned aggregate osgi.core dependency with the OSGi framework chapter
          artifact. Preserve the effective Java 8 main and test targets despite
          parent 52's Java 11 default. Do not change production or test behavior,
          DS services, references, or metatype definitions.
      - id: verification_integrity
        description: |
          Require clean Java 21 verification with all six tests and major-52
          main/test classes. Enforcer, RAT, legal-file and baseline checks must
          remain enabled. Do not add test exclusions, check skips, JVM --add-opens
          workarounds, or overrides of parent-managed plugin versions.
      - id: scope_and_git_hygiene
        description: Limit edits to necessary POM migration changes. Do not stage, commit, push, reset or rewrite history; judge agent actions separately from fixture preparation.
    provenance: {calibration: evals/CALIBRATION.md}

